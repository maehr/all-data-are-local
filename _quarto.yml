project:
  type: website
  render:
    - '*.qmd'
    - '*.md'
    - 'contents/**/*.qmd'
    - 'contents/**/*.md'
    - 'documentation/**/*.qmd'
    - 'documentation/**/*.md'
    - '!**/*.template.md'
    - '!**/*.template.qmd'
    - '!AGENTS.md'
    - '!CLAUDE.md'
    - '!TODO.md'
    - '!README.md'
  resources:
    - 'assets/**'

website:
  title: All Data Are Local
  favicon: android-chrome-512x512.png
  open-graph: true
  twitter-card: true
  site-url: https://maehr.github.io/all-data-are-local/
  repo-url: https://github.com/maehr/all-data-are-local/
  issue-url: https://github.com/maehr/all-data-are-local/issues/new/choose
  repo-actions: [edit, issue]
  page-navigation: true
  bread-crumbs: true
  back-to-top-navigation: true
  search:
    show-item-context: true
    type: overlay
  navbar:
    logo: android-chrome-512x512.png
    logo-alt: 'All Data Are Local'
    title: All Data Are Local
    tools:
      - icon: github
        url: https://github.com/maehr/all-data-are-local/
    left:
      - text: Course
        href: contents/course-description.qmd
      - text: Syllabus
        href: contents/syllabus.qmd
      - text: Assignments
        href: contents/assignments.qmd
      - text: Literature
        href: contents/literature.qmd
      - text: Resources
        href: contents/resources.qmd
      - text: About
        href: contents/about.qmd

  sidebar:
    collapse-level: 1
    contents:
      - text: Home
        href: index.qmd
      - href: contents/course-description.qmd
      - section: Syllabus
        href: contents/syllabus.qmd
        contents: contents/sessions/*
      - href: contents/assignments.qmd
      - href: contents/literature.qmd
      - section: Resources
        href: contents/resources.qmd
        contents:
          - href: contents/cheat-sheet.qmd
      - href: contents/about.qmd
      - section: Project
        contents:
          - text: Reuse this course
            href: documentation/index.qmd
          - text: Changelog
            href: CHANGELOG.md
          - text: Code of Conduct
            href: CODE_OF_CONDUCT.md
          - text: Contributing
            href: CONTRIBUTING.md
          - text: License (Content)
            href: LICENSE-CCBY.md
          - text: License (Code)
            href: LICENSE-AGPL.md
          - text: Security
            href: SECURITY.md

  page-footer:
    left:
      - text: Content under CC BY 4.0
        href: LICENSE-CCBY.md
      - text: Code under AGPL 3.0
        href: LICENSE-AGPL.md
    right:
      - text: Built with Quarto
        href: https://quarto.org/

format:
  html:
    toc: true
    theme:
      - cosmo
      - brand
      - theme.scss
    css: styles.css
    code-copy: true
    code-overflow: wrap
    canonical-url: true
    link-external-icon: true
    link-external-newwindow: true

bibliography: references.bib
suppress-bibliography: true
link-citations: false

freeze: true

editor: visual
