on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

name: Render and Publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  lint:
    name: Lint with Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Check for linting errors
        run: npm run check

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ty check
        run: uv run ty check

  check-pdf:
    name: Check the cheat sheet PDF
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
        with:
          # `git log -- <path>` needs the history that touches the path.
          fetch-depth: 0

      - name: Compare the PDF against its source
        run: |
          src=$(git log -1 --format=%ct -- contents/cheat-sheet.qmd)
          pdf=$(git log -1 --format=%ct -- assets/cheat-sheet.pdf)
          if [ -z "$pdf" ]; then
            echo "::error::assets/cheat-sheet.pdf is missing. Run npm run cheatsheet:pdf."
            exit 1
          fi
          if [ "$src" -gt "$pdf" ]; then
            echo "::error::assets/cheat-sheet.pdf is older than contents/cheat-sheet.qmd. Run npm run cheatsheet:pdf and commit the result."
            exit 1
          fi
          echo "The PDF is current."

  build-optimize:
    name: Build, Optimize, and Upload Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # with:
        # To install LaTeX to build PDF book outputs, uncomment below
        # tinytex: true
        # uncomment below and fill to pin a version
        # version: SPECIFIC-QUARTO-VERSION-HERE

      # add software dependencies here and any libraries

      # From https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      # From https://github.com/julia-actions/setup-julia
      # - name: Setup Julia
      #   uses: julia-actions/setup-julia@v1

      # See more at https://github.com/quarto-dev/quarto-actions/blob/main/examples/example-03-dependencies.md

      - name: Render Quarto Project
        run: npm run site:build

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: built-site
          path: _site

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [lint, lint-python, check-pdf, build-optimize]
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
