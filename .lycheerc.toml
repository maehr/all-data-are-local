# Lychee configuration for link checking
# https://lychee.cli.rs/configuration/

# Exclude template placeholders from link checking
exclude = [
  "ZENODO_RECORD",
  # MIT Press blocks automated requests with 403. The link is correct.
  "https://direct.mit.edu/",
  # Discussions are not enabled. See TODO.md.
  "https://github.com/maehr/all-data-are-local/discussions",
  "https://github.com/maehr/all-data-are-local/stargazers",
  "GITHUB_REPO_ID",
  "https://www.gnu.org/licenses/",
  "https://www.gnu.org/licenses/agpl-3.0.html",
  "https://www.makeareadme.com/",
  "https://fsf.org/",
  "https://book.the-turing-way.org/",
  "https://www.contributor-covenant.org/faq",
  "https://www.contributor-covenant.org/version/2/1/code_of_conduct.html",
  "https://doi.org/10.5281/zenodo.19111355",
  "https://zenodo.org/",
  "https://zenodo.org/badge/614287827.svg",
]

# Timeout for requests (seconds)
timeout = 10

# Maximum number of allowed retries before a link is declared dead
max_retries = 2

# Use compact output for CI
format = "compact"

# Don't show progress bar in CI
no_progress = true

# Enable caching for faster repeated runs
cache = true

# Cache max age (how old entries are considered fresh)
max_cache_age = "7d"

# Accept status codes: 100-103 (informational), 200-299 (success), 429 (rate limit), 503 (unavailable) as non-blocking
accept = ["100..=103", "200..=299", "429", "503", "521", "522", "524"]
